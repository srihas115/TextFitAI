<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TextFitAI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <main class="app-shell">
      <header class="app-header">
        <div class="brand-lockup" aria-label="TextFitAI">
          <span class="brand-mark">T</span>
          <div>
            <p class="eyebrow">AI fitting workspace</p>
            <h1 id="app-title">TextFitAI</h1>
          </div>
        </div>
        <p id="directionPill" class="direction-pill">Auto: fit</p>
      </header>

      <section class="workspace" aria-labelledby="app-title">
        <section class="editor-panel">
          <div class="editor-toolbar">
            <label class="textarea-label" for="textInput">Document</label>
            <div class="counts" aria-live="polite">
              <span><strong id="wordCount">0</strong> words</span>
              <span><strong id="charCount">0</strong> chars</span>
            </div>
          </div>

          <textarea id="textInput" placeholder="Paste text here, then set an inclusive target range."></textarea>
          <p id="statusLine" class="status" aria-live="polite"></p>
        </section>

        <aside class="target-panel" aria-label="Target constraints">
          <div class="panel-heading">
            <p class="eyebrow">Target</p>
            <h2>Fit range</h2>
            <p class="range-note">Bounds are inclusive.</p>
          </div>

          <div class="control-grid">
            <label>
              <span>Min words</span>
              <input id="minWords" type="number" min="0" inputmode="numeric" value="1" />
            </label>
            <label>
              <span>Max words</span>
              <input id="maxWords" type="number" min="0" inputmode="numeric" placeholder="Inclusive max" />
            </label>
            <label>
              <span>Min characters</span>
              <input id="minChars" type="number" min="0" inputmode="numeric" value="1" />
            </label>
            <label>
              <span>Max characters</span>
              <input id="maxChars" type="number" min="0" inputmode="numeric" placeholder="Inclusive max" />
            </label>
          </div>

          <section id="activityPanel" class="activity-panel" aria-live="polite" hidden>
            <div class="activity-header">
              <p id="activityLabel" class="eyebrow">AI activity</p>
              <span id="revisionCounter" class="revision-counter">Revision 0</span>
            </div>
            <div id="activityStream" class="activity-stream"></div>
            <ul id="revisionSummaryList" class="revision-summary-list"></ul>
          </section>

          <button id="fitButton" class="fit-button" type="button">Fit Text</button>
        </aside>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
